[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 110
exclude = ["apps/tracker/migrations", "apps/accounts/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP", "SIM"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
