services:
  postgres:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB through the approved secret manager}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER through the approved secret manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD through the approved secret manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: '5'

  app:
    image: ${APP_IMAGE:?Set an immutable Provider Tracker image reference}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_DATA_MODE: database
      NETWORK_ACCESS_MODE: private-vpn
      PROXY_TRUST_MODE: sanitized-ingress
      REQUEST_ID_SOURCE: trusted-proxy
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL through the approved secret manager}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the private HTTPS application origin}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET through the approved secret manager}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?Set the exact private HTTPS origin}
      AUTH_CLIENT_IP_HEADER: x-real-ip
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:?Set the ingress proxy CIDR range}
      AUDIT_LOG_IP_SALT: ${AUDIT_LOG_IP_SALT:?Set AUDIT_LOG_IP_SALT through the approved secret manager}
      OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:?Set OPERATIONS_TOKEN through the approved secret manager}
    expose:
      - '3000'
    networks:
      - ingress
      - database
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=128m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', '-e', "const http=require('http');const host=new URL(process.env.BETTER_AUTH_URL).host;http.get({hostname:'127.0.0.1',port:3000,path:'/api/health',headers:{host}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      options:
        max-size: 10m
        max-file: '5'

networks:
  ingress:
    external: true
    name: ${PRIVATE_INGRESS_NETWORK:?Set the private ingress network name}
  database:
    internal: true

volumes:
  postgres_data:
