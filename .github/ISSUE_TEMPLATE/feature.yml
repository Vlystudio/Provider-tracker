name: Feature request
description: Suggest an improvement to Provider Tracker.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What needs improvement?
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible behavior and affected roles.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data and access notes
      description: Note any permissions, privacy, import, history, or retention changes.
