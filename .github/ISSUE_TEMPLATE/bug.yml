name: Bug report
description: Report reproducible incorrect behavior using fictional data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach real workbooks, authorization data, provider notes, credentials, or operational logs.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use fictional values and include the role used.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I confirmed this report contains no private or operational data.
          required: true
