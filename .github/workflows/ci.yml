name: verification

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: provider_tracker_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d provider_tracker_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      APP_DATA_MODE: database
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/provider_tracker_ci_test
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3100
      AUDIT_LOG_IP_SALT: ci-only-audit-salt-with-at-least-32-characters
      TARGET_ENVIRONMENT: test
      BENCHMARK_SAMPLES: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:ci
      - run: npm run db:migrate
      - run: npm run test:migration
      - run: npm run test:migration-performance
      - run: npm run db:preflight
      - run: npm run test:postgis
      - run: npm run test:performance
      - run: npm run test:security
      - run: npm run test:automation
      - run: npm run db:audit-integrity
      - run: npm run test:restore
