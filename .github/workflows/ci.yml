name: verification

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_DB: provider_tracker_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d provider_tracker_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      APP_DATA_MODE: database
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/provider_tracker_ci_test
      SECURITY_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/provider_tracker_ci_test
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3100
      AUDIT_LOG_IP_SALT: ci-only-audit-salt-with-at-least-32-characters
      TARGET_ENVIRONMENT: test
      BENCHMARK_SAMPLES: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm run audit:supply-chain
      - run: npm ci
      - run: npm run verify:ci
      - run: npm run db:migrate
      - run: npm run test:database-security
      - run: npm run test:migration
      - run: npm run test:migration-performance
      - run: npm run db:preflight
      - run: npm run test:postgis
      - run: npm run test:performance
      - run: npm run test:security
      - run: npm run test:automation
      - run: npm run db:audit-integrity
      - run: npm run test:restore
      - run: npm sbom --omit=dev --sbom-format cyclonedx > provider-tracker-sbom.cdx.json
      - run: npm run release:evidence > release-evidence.json
        env:
          RELEASE_SBOM_FILE: provider-tracker-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-tracker-release-evidence
          path: |
            provider-tracker-sbom.cdx.json
            release-evidence.json
          if-no-files-found: error
          retention-days: 30

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build --tag provider-tracker:${{ github.sha }} .
      - run: docker image inspect --format '{"imageId":"{{.Id}}"}' provider-tracker:${{ github.sha }} > container-image.json
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: provider-tracker:${{ github.sha }}
          format: json
          output: container-scan.json
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: provider-tracker-container-evidence
          path: |
            container-image.json
            container-scan.json
          if-no-files-found: error
          retention-days: 30
