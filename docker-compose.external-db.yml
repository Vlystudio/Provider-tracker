services:
  web:
    build: .
    env_file: ${APP_ENV_FILE:-.env.production}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-3} --timeout 60 --access-logfile - --error-logfile -
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: ${APP_ENV_FILE:-.env.production}
    command: celery -A config worker --loglevel=INFO
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: .
    env_file: ${APP_ENV_FILE:-.env.production}
    command: celery -A config beat --loglevel=INFO
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
